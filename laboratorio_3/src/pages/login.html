<!doctype html>
<html lang="es-CR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROCOMER | Iniciar sesión</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- ============ PANTALLA DE ACCESO con fondo animado de naturaleza ============ -->
  <main class="auth-page">
    <canvas id="natureCanvas" aria-hidden="true"></canvas>

    <section class="auth-card" id="authCard">
      <a class="brand auth-brand" href="../../index.html">
        <span class="logo-mark"><svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="13" r="7"/><path d="M4 13h14"/><path d="M11 6c2.2 2 3.3 4.4 3.3 7s-1.1 5-3.3 7c-2.2-2-3.3-4.4-3.3-7s1.1-5 3.3-7z"/><path d="M16.8 10.8c-.2-3.6 1.9-5.8 5.2-5.6.2 3.6-1.9 5.8-5.2 5.6z" fill="currentColor" stroke="none"/></svg></span>
        PROCOMER
      </a>

      <h1>Ingrese a su espacio de trabajo</h1>
      <p>Ingrese sus credenciales para continuar.</p>

      <form id="login" novalidate>
        <label>Usuario
          <div class="input-wrap">
            <input name="username" autocomplete="username" required placeholder="Ej.: admin">
          </div>
        </label>

        <label>Contraseña
          <div class="input-wrap">
            <input name="password" id="passInput" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>

        <button class="button primary btn-submit" id="submitBtn">Ingresar</button>
      </form>

      <p style="text-align:center;color:#5c7a6d;font-size:.82rem;margin-top:1rem;font-weight:700;">Credenciales de demostración (click para autocompletar):</p>
      <div class="cred-chips">
        <button type="button" class="cred-chip" data-user="admin" data-pass="admin123">admin / admin123</button>
        <button type="button" class="cred-chip" data-user="analista" data-pass="analista123">analista / analista123</button>
        <button type="button" class="cred-chip" data-user="empresa" data-pass="empresa123">empresa / empresa123</button>
      </div>

      <a class="auth-back" href="../../index.html">← Volver al inicio de PROCOMER</a>
    </section>

    <div id="toast" class="toast"></div>
  </main>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
