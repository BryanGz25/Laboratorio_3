<!doctype html>
<html lang="es-CR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROCOMER | Iniciar sesión</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- ============ PANTALLA DE ACCESO con fondo animado de naturaleza ============ -->
  <main class="auth-page">
    <canvas id="natureCanvas" aria-hidden="true"></canvas>

    <section class="auth-card" id="authCard">
      <a class="brand auth-brand" href="../../index.html">
        <span class="logo-mark">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 21c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M6 21C9 15 13 11 18 8"/></svg>
        </span>
        PRO<b>COMER</b>
      </a>

      <h1>Ingrese a su espacio de trabajo</h1>
      <p>Seleccione su perfil e ingrese sus credenciales para continuar.</p>

      <!-- Selector de perfil interactivo -->
      <div class="role-cards" id="roleCards">
        <button type="button" class="role-card selected" data-role="Administrador">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
          <span>Administrador</span><small>Gestión total</small>
        </button>
        <button type="button" class="role-card" data-role="Analista">
          <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8 11h6M11 8v6"/></svg>
          <span>Analista</span><small>Evaluación</small>
        </button>
        <button type="button" class="role-card" data-role="Empresa">
          <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="7" width="10" height="14" rx="1"/><path d="M13 11h6a2 2 0 0 1 2 2v8H13z"/><path d="M6.5 11h.01M9.5 11h.01M6.5 15h.01M9.5 15h.01"/></svg>
          <span>Empresa</span><small>Solicitudes</small>
        </button>
      </div>

      <form id="login" novalidate>
        <input type="hidden" name="role" value="Administrador">

        <label>Usuario
          <div class="input-wrap">
            <input name="username" autocomplete="username" required placeholder="Ej.: admin">
          </div>
        </label>

        <label>Contraseña
          <div class="input-wrap">
            <input name="password" id="passInput" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>

        <button class="button primary btn-submit" id="submitBtn">Ingresar</button>
      </form>

      <p style="text-align:center;color:#5c7a6d;font-size:.82rem;margin-top:1rem;font-weight:700;">Credenciales de demostración (click para autocompletar):</p>
      <div class="cred-chips">
        <button type="button" class="cred-chip" data-user="admin" data-pass="admin123">admin / admin123</button>
        <button type="button" class="cred-chip" data-user="analista" data-pass="analista123">analista / analista123</button>
        <button type="button" class="cred-chip" data-user="empresa" data-pass="empresa123">empresa / empresa123</button>
      </div>

      <a class="auth-back" href="../../index.html">← Volver al inicio de PROCOMER</a>
    </section>

    <div id="toast" class="toast"></div>
  </main>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
