<!DOCTYPE html>
<html lang="es-CR">
<head>
  <meta charset="UTF-8">
  <title>ProComer - Inicio de Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="solicitud.css">
</head>
<body>
  <a href="../../index.html" class="back-link">&larr; Volver al Inicio</a>
  <main class="main-content">
    <div class="form-card login-card">
      <div class="header" style="text-align: center;">
        <div class="login-logo">
          <div class="logo-icon">PC</div>
        </div>
        <h1>ProComer</h1>
        <p>Inicie sesión para acceder al sistema</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="usuario@procomer.go.cr" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>
        </div>

        <div id="errorMsg" class="error-msg" style="display: none;"></div>

        <div class="form-actions" style="justify-content: center;">
          <button type="submit" class="btn btn-primary btn-login-submit">Iniciar Sesión</button>
        </div>
      </form>

      <div class="profiles-info">
        <p class="profiles-title">Perfiles disponibles:</p>
        <div class="profile-list">
          <div class="profile-item">
            <span class="profile-role admin">Administrador</span>
            <span class="profile-cred">admin@procomer.go.cr / admin123</span>
          </div>
          <div class="profile-item">
            <span class="profile-role gerente">Gerente</span>
            <span class="profile-cred">gerente@procomer.go.cr / gerente123</span>
          </div>
          <div class="profile-item">
            <span class="profile-role usuario">Usuario</span>
            <span class="profile-cred">usuario@procomer.go.cr / usuario123</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const users = {
      'admin@procomer.go.cr': { password: 'admin123', role: 'admin', redirect: 'dashboard.html' },
      'gerente@procomer.go.cr': { password: 'gerente123', role: 'gerente', redirect: 'panelDeAnalista.html' },
      'usuario@procomer.go.cr': { password: 'usuario123', role: 'usuario', redirect: 'cumplimiento.html' }
    };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      const user = users[email];
      if (user && user.password === password) {
        errorMsg.style.display = 'none';
        window.location.href = user.redirect;
      } else {
        errorMsg.textContent = 'Correo o contraseña incorrectos.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
